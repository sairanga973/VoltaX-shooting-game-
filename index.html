<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Space Shooter Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background: #05050d;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
        }

        h1 {
            font-size: 48px;
            color: #00ffcc;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffcc;
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
            color: #cccccc;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #0d0d1a;
            background-color: #00ffcc;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px #00ffcc;
        }

        button:hover {
            background-color: #ffffff;
            box-shadow: 0 0 20px #ffffff;
            transform: scale(1.05);
        }

        .controls-info {
            position: absolute;
            bottom: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-overlay">
            <h1 id="title-text">SPACE SHOOTER</h1>
            <p id="score-text">Use Left/Right Arrows or A/D to move, Space to shoot.</p>
            <button id="start-btn" onclick="startGame()">PLAY GAME</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const uiOverlay = document.getElementById('ui-overlay');
        const titleText = document.getElementById('title-text');
        const scoreText = document.getElementById('score-text');
        const startBtn = document.getElementById('start-btn');

        // Game State Variables
        let isGameRunning = false;
        let score = 0;
        let animationFrameId;

        // Key states
        const keys = {
            left: false,
            right: false,
            shoot: false
        };

        // Player Setup
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 6,
            color: '#00ffcc'
        };

        // Game Entities Arrays
        let bullets = [];
        let enemies = [];
        let particles = [];

        // Shooting Cooldown
        let lastShootTime = 0;
        const shootInterval = 150; // milliseconds

        // Enemy Spawn Timer
        let lastEnemySpawn = 0;
        const enemySpawnInterval = 1000; // milliseconds

        // Event Listeners for Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') keys.shoot = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space') keys.shoot = false;
        });

        function startGame() {
            // Reset Game
            score = 0;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = canvas.width / 2 - 20;
            isGameRunning = true;
            uiOverlay.style.display = 'none';

            // Start Game Loop
            lastEnemySpawn = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameRunning = false;
            cancelAnimationFrame(animationFrameId);

            titleText.innerText = "GAME OVER";
            scoreText.innerText = `Final Score: ${score}`;
            startBtn.innerText = "PLAY AGAIN";
            uiOverlay.style.display = 'flex';
        }

        // --- GAME LOOP ---
        function gameLoop(timestamp) {
            if (!isGameRunning) return;

            update(timestamp);
            draw();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- UPDATE LOGIC ---
        function update(timestamp) {
            // Player Movement
            if (keys.left && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys.right && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Player Shooting
            if (keys.shoot && timestamp - lastShootTime > shootInterval) {
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y,
                    width: 6,
                    height: 15,
                    speed: 8,
                    color: '#ff0055'
                });
                lastShootTime = timestamp;
            }

            // Move Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < -bullets[i].height) {
                    bullets.splice(i, 1);
                }
            }

            // Spawn Enemies
            if (timestamp - lastEnemySpawn > enemySpawnInterval) {
                const enemyWidth = 35;
                const enemyX = Math.random() * (canvas.width - enemyWidth);
                enemies.push({
                    x: enemyX,
                    y: -35,
                    width: enemyWidth,
                    height: 35,
                    speed: 2 + Math.random() * 2, // Random speed
                    color: '#ffcc00'
                });
                lastEnemySpawn = timestamp;
            }

            // Move Enemies and Check Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.y += enemy.speed;

                // Check collision with bottom wall (Game Over)
                if (enemy.y > canvas.height) {
                    gameOver();
                    return;
                }

                // Check collision with Player
                if (checkCollision(player, enemy)) {
                    createExplosion(player.x + player.width/2, player.y + player.height/2, '#00ffcc');
                    gameOver();
                    return;
                }

                // Check collision with Bullets
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (checkCollision(bullet, enemy)) {
                        // Explosion particles
                        createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                        
                        // Remove bullet and enemy
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        break;
                    }
                }
            }

            // Update Explosion Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // --- COLLISION DETECTION ---
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // --- EXPLOSION EFFECT ---
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        // --- DRAW LOGIC ---
        function draw() {
            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player Ship (Triangle)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Draw Bullets
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            // Draw Enemies (Inverted Triangle)
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.moveTo(enemy.x, enemy.y);
                ctx.lineTo(enemy.x + enemy.width, enemy.y);
                ctx.lineTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
                ctx.closePath();
                ctx.fill();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw HUD Score
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px sans-serif';
            ctx.fillText(`Score: ${score}`, 20, 35);
        }
    </script>
</body>
</html>
